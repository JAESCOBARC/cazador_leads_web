services:
  - type: web
    name: cazador-leads-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: MAX_RESULTS
        value: "20"
      - key: MAX_SCAN_WEBS
        value: "40"
      - key: SERPAPI_CUOTA_MES
        value: "100"
      - key: ALERTA_EMAIL_DESTINO
        sync: false
      - key: ALERTA_UMBRALES
        value: "80"
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CLAVE
        sync: false
      - key: EMAIL_REMITENTE
        sync: false
      - key: ENVIO_MAX_DIA
        value: "5"
      - key: LOTE_MAX_CREDITOS
        value: "50"
      - key: CASO_EXITO
        sync: false
      - key: NOMINATIM_CONTACTO
        sync: false
      - key: REMITENTE_NOMBRE
        sync: false
      - key: REMITENTE_CARGO
        sync: false
      - key: AGENCIA_NOMBRE
        sync: false
      - key: REMITENTE_CONTACTO
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
